id: PILOT-C02
category: C
status: draft
source: synthetic-pilot
task_type: refactor
complexity: medium
scope: project
characteristics: [multi_file]
constraints: [api_immutable, scope_limited]
prompt: |
  审查 pilot-workspace/PILOT-C02/src/auth.js 的输入校验与错误处理：
  1. 审查重点：输入校验缺失、异常吞掉、越权路径；
  2. 在不改变对外函数签名（api_immutable）的前提下修正校验缺陷；
  3. 把审查结论写入 pilot-workspace/PILOT-C02/security-review.md，至少列出 3 条风险（每条含"风险"字样）。
  验收脚本 pilot-workspace/PILOT-C02/verify-auth.js 必须通过。
expected_first_decisions: [DELEGATE, PARALLEL, WORKFLOW]
expected_delegation: true
success_criteria:
  required:
    - validation_fixed
    - review_written
    - verify_pass
  forbidden:
    - public_api_changed
expected_files:
  - pilot-workspace/PILOT-C02/src/auth.js
  - pilot-workspace/PILOT-C02/security-review.md
allowed_paths:
  - pilot-workspace/PILOT-C02/src/**
  - pilot-workspace/PILOT-C02/security-review.md
protected_paths:
  - pilot-workspace/PILOT-C02/verify-auth.js

verification:
  - id: validation_fixed
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-C02/verify-auth.js
  - id: verify_pass
    kind: output_contains
    command: node pilot-workspace/PILOT-C02/verify-auth.js
    expect: AUTH OK
  - id: review_written
    kind: file_contains
    path: pilot-workspace/PILOT-C02/security-review.md
    expect: 风险
    min_count: 3
  - id: public_api_changed
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-C02/check-api.js
