id: PILOT-C01
category: C
status: frozen
source: synthetic-pilot
task_type: ui_upgrade
complexity: medium
scope: project
characteristics: [multi_page]
constraints: [no_public_interface_change, scope_limited]
prompt: |
  对 pilot-workspace/PILOT-C01/ui/ 下的样式做无障碍审查并修订：
  1. 审查范围：对比度、焦点可见性、aria 标注与命中区大小；
  2. 按审查结论修订 ui/a11y.css（不得改类名与选择器结构）；
  3. 把审查结论整理为 pilot-workspace/PILOT-C01/a11y-review.md，至少列出 3 条无障碍风险（每条含"风险"字样）。
  验收脚本 pilot-workspace/PILOT-C01/verify-a11y.js 必须通过。
expected_first_decisions: [DELEGATE, PARALLEL, WORKFLOW]
expected_delegation: true
success_criteria:
  required:
    - a11y_css_fixed
    - review_written
    - verify_pass
  forbidden:
    - selector_structure_changed
expected_files:
  - pilot-workspace/PILOT-C01/ui/a11y.css
  - pilot-workspace/PILOT-C01/a11y-review.md
allowed_paths:
  - pilot-workspace/PILOT-C01/ui/**
  - pilot-workspace/PILOT-C01/a11y-review.md
protected_paths:
  - pilot-workspace/PILOT-C01/verify-a11y.js

verification:
  - id: a11y_css_fixed
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-C01/verify-a11y.js
  - id: verify_pass
    kind: output_contains
    command: node pilot-workspace/PILOT-C01/verify-a11y.js
    expect: A11Y OK
  - id: review_written
    kind: file_contains
    path: pilot-workspace/PILOT-C01/a11y-review.md
    expect: 风险
    min_count: 3
  - id: selector_structure_changed
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-C01/check-selectors.js
