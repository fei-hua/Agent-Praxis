id: PILOT-A02
category: A
status: frozen
source: synthetic-pilot
task_type: doc
complexity: simple
scope: project
characteristics: []
constraints: [scope_limited]
prompt: |
  为 pilot-workspace/PILOT-A02/src/parser.js 的全部导出函数补写 JSDoc 注释（每个导出函数一条，
  含 @param 与 @returns）。
  要求：pilot-workspace/PILOT-A02/check-doc.js 通过（输出 DOC OK 且退出码 0）。
  只能修改 parser.js；check-doc.js 为验收脚本，不得修改。
expected_first_decisions: [DIRECT, EXPLORE]
expected_delegation: false
success_criteria:
  required:
    - docs_added
    - doc_check_pass
  forbidden:
    - parser_behavior_changed
expected_files:
  - pilot-workspace/PILOT-A02/src/parser.js
allowed_paths:
  - pilot-workspace/PILOT-A02/**
protected_paths:
  - pilot-workspace/PILOT-A02/check-doc.js

verification:
  - id: docs_added
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-A02/check-doc.js
  - id: doc_check_pass
    kind: output_contains
    command: node pilot-workspace/PILOT-A02/check-doc.js
    expect: DOC OK
  - id: parser_behavior_changed
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-A02/check-behavior.js
