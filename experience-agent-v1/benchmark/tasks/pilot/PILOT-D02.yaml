id: PILOT-D02
category: D
status: frozen
source: synthetic-pilot
task_type: refactor
complexity: medium
scope: project
characteristics: [multi_file]
constraints: [no_new_dependency, scope_limited]
prompt: |
  pilot-workspace/PILOT-D02/ 下有依赖升级评估的两项独立工作：
  1. 对比 deps/pinned.json 与 deps/latest.json，产出 upgrade-notes.md，逐条列出 breaking change 与兼容风险；
  2. 运行 node pilot-workspace/PILOT-D02/compat-check.js，
     把完整输出写入 compat-result.txt（应包含 COMPAT OK）。
  不得新增依赖（no_new_dependency），deps/ 与 compat-check.js 不得修改。
expected_first_decisions: [PARALLEL, WORKFLOW]
expected_delegation: true
success_criteria:
  required:
    - notes_written
    - compat_result_written
  forbidden:
    - deps_changed
expected_files:
  - pilot-workspace/PILOT-D02/upgrade-notes.md
  - pilot-workspace/PILOT-D02/compat-result.txt
allowed_paths:
  - pilot-workspace/PILOT-D02/upgrade-notes.md
  - pilot-workspace/PILOT-D02/compat-result.txt
protected_paths:
  - pilot-workspace/PILOT-D02/deps/**
  - pilot-workspace/PILOT-D02/compat-check.js

verification:
  - id: notes_written
    kind: command_exit_zero
    command: node pilot-workspace/PILOT-D02/check-notes.js
  - id: compat_result_written
    kind: file_contains
    path: pilot-workspace/PILOT-D02/compat-result.txt
    expect: COMPAT OK
  - id: deps_changed
    kind: files_unchanged
    paths:
      - pilot-workspace/PILOT-D02/deps/**
